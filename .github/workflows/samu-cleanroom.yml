name: SAMU host-only clean-room tests
on:
  push:
    paths:
      - 'tools/samu-research/**'
      - 'docs/SAMU_900_*.md'
      - '.github/workflows/samu-cleanroom.yml'
  pull_request:
    paths:
      - 'tools/samu-research/**'
      - 'docs/SAMU_900_*.md'
      - '.github/workflows/samu-cleanroom.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Python and Clang are available
        run: |
          python3 --version
          clang --version | head -n1
      - name: Run isolated tests, sanitizers, fuzz smoke, static analysis
        run: make -C tools/samu-research cleanroom
      - name: Final check that no binary artifacts are present in the source tree
        run: python3 tools/samu-research/cleanroom_guard.py
